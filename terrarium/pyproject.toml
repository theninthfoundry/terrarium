[build-system]
requires=['setuptools>=69','wheel']
build-backend='setuptools.build_meta'
[project]
name='terrarium-change-intelligence'
version='0.3.0'
requires-python='>=3.10'
description='Evidence-backed mutation-calibrated test impact analysis'
dependencies=['fastapi>=0.115,<1','uvicorn>=0.30,<1','networkx>=3.3,<4','pydantic>=2.8,<3','pytest>=8.3,<10']
[project.optional-dependencies]
dev=['httpx>=0.27,<1','ruff>=0.6']
gemma=['google-genai>=1.0']
mcp=['mcp>=1.28,<2']
[project.scripts]
terrarium='terrarium.cli:main'
[tool.setuptools.packages.find]
include=['terrarium*']
[tool.pytest.ini_options]
testpaths=['tests']
