[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrarium-change-intelligence"
version = "0.1.0"
description = "Mutation-validated test impact analysis with evidence-backed trust reporting."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "The Ninth Foundry"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "networkx>=3.3,<4",
  "pydantic>=2.8,<3",
  "pytest>=8.3,<10",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "ruff>=0.6"]
gemma = ["google-genai>=1.0"]

[project.scripts]
terrarium = "terrarium.cli:main"

[tool.setuptools.packages.find]
include = ["terrarium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
